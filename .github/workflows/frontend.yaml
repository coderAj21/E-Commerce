name: Deploy Frontend Build to AWS EC2

on:
  push:
    branches:
      - frontend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm i # Using ci for more reliable installs

      - name: Build the project
        run: CI=false npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Download built artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: build

      - name: Add SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY_FRONTEND }}
        run: |
          echo "$EC2_SSH_KEY" > key.pem
          chmod 600 key.pem

      - name: Copy build files to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST_FRONTEND }}
          EC2_USER: ${{ secrets.EC2_USER }}
          DEPLOY_PATH: ${{ secrets.EC2_DEPLOY_PATH || 'frontend' }}
        run: |
          scp -i key.pem -o StrictHostKeyChecking=no -r build "$EC2_USER@$EC2_HOST:frontend"

      - name: Restart server on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST_FRONTEND }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i key.pem -o StrictHostKeyChecking=no "$EC2_USER@$EC2_HOST" << 'EOF'
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          export PATH="$NVM_DIR/versions/node/$(nvm current)/bin:$PATH"
          cd frontend
          # Ensure correct permissions
          sudo chown -R $USER:$USER build
          sudo chmod -R 755 build
          
          # Restart PM2 process
          pm2 restart ecosystem.config.js
          EOF
