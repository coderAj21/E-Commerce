name: Deploy Frontend Build to AWS EC2

on:
  push:
    branches:
      - frontend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # Use latest 20.x version

      - name: Install dependencies
        run: npm install

      - name: Build the project
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: frontend-build
          path: build # Upload only the build folder

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: success() # Run deploy only if build was successful

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download built artifact
        uses: actions/download-artifact@v3
        with:
          name: frontend-build
          path: build # Download the build folder

      - name: Add SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY_FRONTEND }}
        run: |
          echo "$EC2_SSH_KEY" > key.pem
          chmod 600 key.pem

      - name: Copy build files to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST_FRONTEND }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          scp -i key.pem -o StrictHostKeyChecking=no -r build "$EC2_USER@$EC2_HOST:/frontend"

      - name: Restart server on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST_FRONTEND }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i key.pem -o StrictHostKeyChecking=no "$EC2_USER@$EC2_HOST" << 'EOF'
          cd /var/www/frontend
          # Ensure correct permissions
          sudo chown -R $USER:$USER build
          sudo chmod -R 755 build
          
          # Restart PM2 process
          if pm2 list | grep -q "ecosystem.config.js"; then
            pm2 restart ecosystem.config.js
          else
            pm2 start ecosystem.config.js
          fi
          EOF
